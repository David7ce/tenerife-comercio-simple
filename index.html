<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Comercio - Tenerife</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Panel Izquierdo - Buscador -->
        <div class="left-panel">
            <div class="panel-header">
                <h2>🔍 Buscador</h2>
            </div>
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Buscar comercios..."
                >
            </div>
            <div class="results-list" id="resultsList">
                <p style="color: #999; text-align: center; margin-top: 20px;">
                    Escribe para buscar comercios
                </p>
            </div>
        </div>

        <!-- Mapa -->
        <div id="map">
            <div class="map-controls">
                <button id="toggleHeatmap" class="map-control-btn" title="Mapa de Calor">
                    🔥 Mapa de Calor
                </button>
            </div>
            <!-- Indicador de carga -->
            <div id="loadingIndicator" class="loading-indicator">
                <div class="loading-spinner"></div>
                <p>Cargando marcadores...</p>
            </div>
        </div>

        <!-- Panel Derecho - Filtros -->
        <div class="right-panel">
            <div class="panel-header">
                <h2>🏷️ Categorías</h2>
            </div>
            <div class="filter-container" id="filterContainer">
                <!-- Los filtros se generarán dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS - Must load before other scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="script.js"></script>
</body>
</html>
